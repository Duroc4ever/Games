<div class="game-button-koopas" onclick="openKoopasRevenge()">

  <!-- CHANGE ONLY THIS IMAGE URL -->
  <img src="https://i1.sndcdn.com/artworks-z2z5THzE9Jsf79Qw-XzSzTQ-t500x500.jpg">

  <div class="game-name-koopas">
   A Koopa's Revenge
  </div>

</div>

<style>

.game-button-koopas {
  position: relative;
  width: 160px;
  height: 160px;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.game-button-koopas:hover {
  transform: scale(1.05);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.45);
}

.game-button-koopas img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  transition: filter 0.2s ease;
}

.game-button-koopas:hover img {
  filter: brightness(55%);
}

.game-name-koopas {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 10px;

  color: white;

  font-family: Arial, sans-serif;
  font-size: 17px;
  font-weight: bold;

  opacity: 0;

  transition: opacity 0.2s ease;

  pointer-events: none;
}

.game-button-koopas:hover .game-name-koopas {
  opacity: 1;
}

</style>


<script>

function openKoopasRevenge() {

  const gameHTML = `

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Koopa's Revenge</title>

<style>

html,
body {

  margin: 0;
  padding: 0;

  background: black;

  overflow: hidden;

  height: 100%;
  width: 100%;

}

#flash-container {

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  background: black;

  overflow: hidden;

}

.black-box {

  position: fixed;

  background: black;

  z-index: 10;

}

#box-top {

  top: 0;
  left: 0;

  width: 100%;
  height: 0;

}

#box-bottom {

  bottom: 0;
  left: 0;

  width: 100%;
  height: 0;

}

#box-left {

  top: 0;
  left: 0;

  width: 0;
  height: 100%;

}

#box-right {

  top: 0;
  right: 0;

  width: 0;
  height: 100%;

}

ruffle-player {

  width: 100%;
  height: 100%;

  background: black;

  display: block;

}

</style>


<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"><\/script>

</head>


<body>

<div id="flash-container"></div>

<div
  class="black-box"
  id="box-top">
</div>

<div
  class="black-box"
  id="box-bottom">
</div>

<div
  class="black-box"
  id="box-left">
</div>

<div
  class="black-box"
  id="box-right">
</div>


<script>

const container =
  document.getElementById(
    "flash-container"
  );

const boxTop =
  document.getElementById(
    "box-top"
  );

const boxBottom =
  document.getElementById(
    "box-bottom"
  );

const boxLeft =
  document.getElementById(
    "box-left"
  );

const boxRight =
  document.getElementById(
    "box-right"
  );


function resizeGame() {

  const windowWidth =
    window.innerWidth;

  const windowHeight =
    window.innerHeight;

  const aspectRatio =
    5.5 / 3;


  let width =
    Math.floor(
      windowWidth
    );

  let height =
    Math.floor(
      width / aspectRatio
    );


  if (
    height > windowHeight
  ) {

    height =
      Math.floor(
        windowHeight
      );

    width =
      Math.floor(
        height * aspectRatio
      );

  }


  container.style.width =
    width + "px";

  container.style.height =
    height + "px";


  const topMargin =
    (windowHeight - height) / 2;

  const leftMargin =
    (windowWidth - width) / 2;


  boxTop.style.height =
    topMargin + "px";

  boxBottom.style.height =
    topMargin + "px";

  boxLeft.style.width =
    leftMargin + "px";

  boxRight.style.width =
    leftMargin + "px";

}


window.addEventListener(
  "resize",
  resizeGame
);


window.addEventListener(
  "DOMContentLoaded",
  () => {

    resizeGame();


    const ruffle =
      window.RufflePlayer?.newest() ||
      window.RufflePlayer?.createPlayer();


    if (
      ruffle &&
      container
    ) {

      const player =
        ruffle.createPlayer();


      player.style.width =
        "100%";

      player.style.height =
        "100%";

      player.style.background =
        "black";


      container.appendChild(
        player
      );


      player.load(
        "https://cdn.jsdelivr.net/gh/Panchamp98/akoopasrevenge@676b21863f355fac30bd16acd9d5175a69876f86/292165_KoopasRevenge.swf"
      );


    } else {

      container.textContent =
        "Ruffle failed to load.";

    }

  }
);

<\/script>

</body>

</html>

  `;


  const newTab =
    window.open(
      "",
      "_blank"
    );


  if (!newTab) {

    alert(
      "Please allow pop-ups for this site."
    );

    return;

  }


  newTab.document.open();

  newTab.document.write(
    gameHTML
  );

  newTab.document.close();

}

</script>
