<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Eaglercraft 1.12.2</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            text-align: center;
        }

        #loading h1 {
            margin-bottom: 10px;
        }

        #status {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        #play {
            display: none;

            padding: 14px 28px;

            background: #4a148c;
            color: white;

            border: 0;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #play:hover {
            background: #641db5;
        }

        #error {
            display: none;

            max-width: 600px;

            padding: 20px;

            color: #ff8080;
        }
    </style>
</head>

<body>

<div id="loading">

    <h1>Eaglercraft 1.12.2</h1>

    <div id="status">
        Loading game...
    </div>

    <button id="play">
        PLAY
    </button>

    <div id="error"></div>

</div>


<script>

const GAME_URL =
    "https://cdn.jsdelivr.net/gh/PlanetDogeCodes/Eagletcraft-1.12@main/source%20file/egc1-12.xml";


const DB_NAME = "EaglercraftLauncher";

const STORE_NAME = "GameFiles";

const CACHE_MAX_AGE =
    90 * 24 * 60 * 60 * 1000;


/* --------------------------------------------------
   Open IndexedDB
-------------------------------------------------- */

function openDatabase() {

    return new Promise((resolve, reject) => {

        const request =
            indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {

                db.createObjectStore(
                    STORE_NAME,
                    { keyPath: "url" }
                );

            }

        };

        request.onsuccess = function(event) {

            resolve(event.target.result);

        };

        request.onerror = function() {

            reject(request.error);

        };

    });

}


/* --------------------------------------------------
   Save downloaded game
-------------------------------------------------- */

async function saveGame(url, content) {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.put({
                url: url,
                content: content,
                timestamp: Date.now()
            });

        request.onsuccess =
            () => resolve();

        request.onerror =
            () => reject(request.error);

    });

}


/* --------------------------------------------------
   Get cached game
-------------------------------------------------- */

async function getCachedGame(url) {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.get(url);

        request.onsuccess = async function() {

            const cached =
                request.result;

            if (
                cached &&
                Date.now() - cached.timestamp
                    < CACHE_MAX_AGE
            ) {

                resolve(cached.content);

                return;

            }

            try {

                const response =
                    await fetch(url);

                if (!response.ok) {

                    throw new Error(
                        "HTTP " + response.status
                    );

                }

                const content =
                    await response.text();

                await saveGame(
                    url,
                    content
                );

                resolve(content);

            } catch (error) {

                reject(error);

            }

        };

        request.onerror = function() {

            reject(request.error);

        };

    });

}


/* --------------------------------------------------
   Download the game
-------------------------------------------------- */

async function loadGame() {

    const status =
        document.getElementById("status");

    try {

        status.textContent =
            "Checking local cache...";

        const gameHTML =
            await getCachedGame(GAME_URL);

        status.textContent =
            "Game is ready!";

        const play =
            document.getElementById("play");

        play.style.display =
            "inline-block";


        play.onclick = function() {

            runGame(gameHTML);

        };

    } catch (error) {

        console.error(error);

        status.style.display =
            "none";

        const errorBox =
            document.getElementById("error");

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "The game could not be loaded. " +
            "Please try again later.\n\n" +
            error.message;

    }

}


/* --------------------------------------------------
   Run the downloaded game
-------------------------------------------------- */

function runGame(gameHTML) {

    const gameWindow =
        window.open("", "_blank");

    if (!gameWindow) {

        alert(
            "The browser blocked the new tab. " +
            "Please allow pop-ups for this site."
        );

        return;

    }


    gameWindow.document.open();

    gameWindow.document.write(
        gameHTML
    );

    gameWindow.document.close();

}


/* --------------------------------------------------
   Start
-------------------------------------------------- */

loadGame();

</script>

</body>
</html>
